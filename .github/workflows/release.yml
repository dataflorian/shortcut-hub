name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rust tests
        working-directory: native
        run: cargo test

      - name: Run Python tests
        run: python test_suite.py -v

      - name: Build release binary
        working-directory: native
        run: cargo build --release

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist\shortcut-hub"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "native\target\release\shortcut-hub.exe" $stage
          Copy-Item "config.json" $stage
          Copy-Item "install.ps1" $stage
          Copy-Item "store.py" $stage
          Copy-Item "discovery.py" $stage
          Copy-Item "powertoys_yaml.py" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $zipPath = Join-Path $PWD "dist\shortcut-hub-windows-x86_64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  shortcut-hub-windows-x86_64.zip" | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/shortcut-hub-windows-x86_64.zip
            dist/SHA256SUMS.txt
